name: Build Godot iOS 3D Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Download Godot 3.4.2 editor (insecure SSL)
        run: |
          curl -k -L -o godot.zip https://free.downloads.tuxfamily.net/godotengine/3.4.2/Godot_v3.4.2-stable_osx.universal.zip
          unzip godot.zip
          curl -k -L -o ios_templates.zip https://free.downloads.tuxfamily.net/godotengine/3.4.2/Godot_v3.4.2-stable_ios.template.zip
          unzip ios_templates.zip
          mkdir -p ~/Library/Application\ Support/Godot/templates/3.4.2.stable
          cp -r iOS_*/* ~/Library/Application\ Support/Godot/templates/3.4.2.stable/

      - name: Create a simple 3D game project
        run: |
          mkdir MyGame
          cat > MyGame/project.godot <<'EOF'
          [application]
          config/name="RotatingCube"
          run/main_scene="res://Main.tscn"

          [display]
          window/size/width=1024
          window/size/height=768

          [rendering]
          quality/driver/driver_name="GLES3"
          vram_compression/import_etc=true
          EOF

          cat > MyGame/Main.tscn <<'EOF'
          [gd_scene load_steps=2 format=2]

          [ext_resource path="res://cube.gd" type="Script" id=1]

          [node name="Root" type="Spatial"]
          script = ExtResource(1)

          [node name="Camera" type="Camera" parent="."]
          transform = Transform(1,0,0, 0,1,0, 0,0,1, 0,2,5)
          current = true

          [node name="Cube" type="MeshInstance" parent="."]
          mesh = SubResource(1)

          [sub_resource type="CubeMesh" id=1]
          material/0 = SubResource(2)

          [sub_resource type="SpatialMaterial" id=2]
          albedo_color = Color(1,0,0,1)
          EOF

          cat > MyGame/cube.gd <<'EOF'
          extends Spatial
          func _process(delta):
              $Cube.rotate_y(delta)
          EOF

      - name: Export iOS Xcode project (headless)
        run: |
          mkdir -p export
          # Allow execution of Godot
          chmod +x Godot.app/Contents/MacOS/Godot
          ./Godot.app/Contents/MacOS/Godot --path MyGame --export "iOS" export/MyGame.xcodeproj

      - name: Build and archive the .ipa
        run: |
          cd export
          xcodebuild -project MyGame.xcodeproj -scheme MyGame -configuration Release \
                     -sdk iphoneos -archivePath MyGame.xcarchive archive
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>provisioningProfiles</key><dict/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath MyGame.xcarchive -exportPath output \
                     -exportOptionsPlist exportOptions.plist

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotatingCube.ipa
          path: export/output/*.ipa
