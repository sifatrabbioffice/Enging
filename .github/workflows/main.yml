name: Build Godot Engine for iOS

on:
  workflow_dispatch:  # Manual trigger only – adjust as needed

jobs:
  build-ios:
    runs-on: macos-latest   # iOS builds require macOS
    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.2-stable   # Use stable branch, change as desired
          submodules: recursive

      - name: Setup Python and SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Install iOS build dependencies
        run: |
          # Install required system tools (xcodegen, etc.)
          brew install yasm

      - name: Build for iOS (arm64 + simulator)
        run: |
          # Configure and build for iOS device (arm64) and simulator (x86_64)
          scons platform=ios arch=arm64 target=template_release \
                ios_simulator=no tools=no \
                verbose=yes
          scons platform=ios arch=x86_64 target=template_release \
                ios_simulator=yes tools=no \
                verbose=yes

      - name: Create Xcode project and archive (.ipa)
        run: |
          # Use Godot's iOS build script to produce an .ipa
          cd misc/dist/ios_xcode
          xcodegen generate
          xcodebuild -project godot.xcodeproj -scheme godot \
                     -sdk iphoneos -configuration Release \
                     -archivePath ./godot.xcarchive archive
          xcodebuild -exportArchive -archivePath ./godot.xcarchive \
                     -exportPath ./output -exportOptionsPlist exportOptions.plist
          # exportOptions.plist must be present – create a minimal one:
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>provisioningProfiles</key>
              <dict/>
          </dict>
          </plist>' > exportOptions.plist
          xcodebuild -exportArchive -archivePath ./godot.xcarchive \
                     -exportPath ./output -exportOptionsPlist exportOptions.plist

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS.ipa
          path: output/*.ipa
