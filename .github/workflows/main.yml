name: Build Godot Engine for iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Branch/Tag to build (e.g., 4.2, 4.3-stable, master)'
        required: true
        default: '4.3-stable'
      build_target:
        description: 'Build Target (editor = Run Godot Editor on iOS, template = Game Export Template)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Godot Engine Source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.godot_version }} https://github.com/godotengine/godot.git godot-source

      - name: Set up Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons via Homebrew
        run: |
          brew install scons vulcan-headers

      - name: Set up Xcode SDK
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -showsdks

      - name: Compile Godot for iOS (Simulator & Device Architecture)
        run: |
          cd godot-source
          
          if [ "${{ github.event.inputs.build_target }}" = "editor" ]; then
            echo "Building Godot Editor Toolchain..."
            scons platform=ios target=editor arch=arm64 vulkan=yes tests=no
          else
            echo "Building Godot Export Templates (Release & Debug)..."
            scons platform=ios target=template_release arch=arm64 vulkan=yes tests=no
            scons platform=ios target=template_debug arch=arm64 vulkan=yes tests=no
          fi

      - name: Package Unsigned .app Bundle into .ipa
        run: |
          cd godot-source
          mkdir -p Payload
          
          if [ "${{ github.event.inputs.build_target }}" = "editor" ]; then
            cp -r bin/godot.ios.editor.arm64.framework Payload/GodotEditor.app || true
          else
            cp -r bin/godot.ios.template_release.arm64.framework Payload/GodotTemplate.app || true
          fi
          
          zip -r ../godot-ios-unsigned.ipa Payload

      - name: Upload Unsigned IPA Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-${{ github.event.inputs.build_target }}-${{ github.event.inputs.godot_version }}
          path: godot-ios-unsigned.ipa
          retention-days: 7
