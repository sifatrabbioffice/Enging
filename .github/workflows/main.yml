name: Build Godot 3.6 Engine for iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Godot 3.6 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 3.6-stable
          submodules: recursive

      - name: Setup Python & SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Build iOS static library (GLES3)
        run: |
          scons platform=ios target=release_debug \
                tools=no arch=arm64 \
                vulkan=no \
                builtin_libpng=yes builtin_zlib=yes \
                use_llvm=yes ios_simulator=no

      - name: Locate and copy static library
        run: |
          LIB_PATH=$(find bin -name "*.a" | head -n 1)
          if [ -z "$LIB_PATH" ]; then
            echo "ERROR: No static library found in bin/"
            ls -la bin/
            exit 1
          fi
          echo "Found library: $LIB_PATH"
          mkdir -p Payload/Godot.app
          cp "$LIB_PATH" Payload/Godot.app/Godot

      - name: Create Info.plist and main.m
        run: |
          cat > Payload/Godot.app/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Godot</string>
            <key>CFBundleIdentifier</key><string>com.example.godot</string>
            <key>CFBundleName</key><string>Godot</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>12.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF
          
          cat > main.m <<EOF
          #import <UIKit/UIKit.h>
          @interface GodotAppDelegate : UIResponder <UIApplicationDelegate>
          @end
          @implementation GodotAppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              return YES;
          }
          @end
          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"GodotAppDelegate");
              }
          }
          EOF

      - name: Compile and link
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDKROOT" -miphoneos-version-min=12.0 \
                -framework UIKit -framework OpenGLES -framework Metal \
                -framework CoreAudio -framework Foundation -framework QuartzCore \
                main.m Payload/Godot.app/Godot -o Payload/Godot.app/Godot

      - name: Sign the executable
        run: |
          # Write entitlements to a file
          cat > entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key><false/>
          </dict>
          </plist>
          EOF
          codesign -s - --entitlements entitlements.plist Payload/Godot.app/Godot

      - name: Package .ipa
        run: |
          zip -r Godot-iOS.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS.ipa
          path: Godot-iOS.ipa
