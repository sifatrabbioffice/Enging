name: Export Godot Game to iOS (Unsigned IPA)

on:
  workflow_dispatch: # Manual trigger

env:
  GODOT_VERSION: "4.2.1"                  # Change to your Godot version

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Download Godot Engine and Export Templates
        run: |
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Create Export Directory
        run: mkdir -p build/ios

      - name: Godot Headless Export to Xcode Project
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/export_output.xcodeproj

      - name: Compile Xcode Project (No Code Signing)
        run: |
          cd build/ios
          
          # 1. Dynamically locate whatever .xcodeproj Godot generated
          XCODE_PROJ=$(find . -name "*.xcodeproj" -type d | head -1)
          
          if [ -z "$XCODE_PROJ" ]; then
            echo "::error::No .xcodeproj found! Ensure your export_presets.cfg is committed to your repository and contains an 'iOS' preset configuration."
            ls -la
            exit 1
          fi
          
          # 2. Extract the actual scheme name from the file system
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          echo "Found Project: $XCODE_PROJ"
          echo "Extracted Scheme: $SCHEME_NAME"
          
          # 3. Compile and explicitly dump outputs locally via -derivedDataPath
          xcodebuild -project "$XCODE_PROJ" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO \
                     -allowProvisioningUpdates \
                     clean build

      - name: Package App Bundle into Physical IPA
        run: |
          mkdir -p Packaging/Payload
          
          # Dynamically search the export folder for the compiled .app bundle
          APP_PATH=$(find build/ios/ -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find the compiled .app binary package!"
            exit 1
          fi
          
          echo "Packaging application bundle from path: $APP_PATH"
          cp -r "$APP_PATH" Packaging/Payload/
          
          cd Packaging
          zip -r ../GodotGame.ipa Payload
          cd ..

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotGame-iOS-Unsigned
          path: GodotGame.ipa
          retention-days: 7
