name: Export Godot Game to iOS (Unsigned IPA)

on:
  workflow_dispatch: # Manual trigger
  push:

env:
  GODOT_VERSION: "4.2.1"                  # Change to your Godot version
  EXPORT_NAME: "MyGodotGame"              # The name of your game/export preset

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode version
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Download Godot Engine and Export Templates
        run: |
          # Download headless Godot editor for macOS
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          # Setup export templates directory path
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          
          # Download templates
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          
          # Move templates to the proper structural location
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          rm -rf templates Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Create Export Directory
        run: mkdir -p build/ios

      - name: Godot Headless Export to Xcode Project
        run: |
          # Note: Ensure you have an export preset named exactly "iOS" in your export_presets.cfg
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/${{ env.EXPORT_NAME }}.xcodeproj

      - name: Compile Xcode Project (No Code Signing)
        run: |
          cd build/ios
          xcodebuild -project ${{ env.EXPORT_NAME }}.xcodeproj \
                     -scheme ${{ env.EXPORT_NAME }} \
                     -configuration Release \
                     -sdk iphoneos \
                     DEFAULT_PREFERENCES_DOMAIN=com.mycompany.${{ env.EXPORT_NAME }} \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO \
                     -allowProvisioningUpdates \
                     clean build

      - name: Package App Bundle into Physical IPA
        run: |
          # Create the Payload environment structure iOS expects
          mkdir -p Packaging/Payload
          
          # Locate the compiled .app bundle and copy it into the Payload folder
          APP_PATH=$(find build/ios/build/Release-iphoneos/ -name "*.app" -type d | head -1)
          cp -r "$APP_PATH" Packaging/Payload/
          
          # Compress the Payload folder into a physical .ipa file
          cd Packaging
          zip -r ../${{ env.EXPORT_NAME }}.ipa Payload
          cd ..

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-iOS-Unsigned
          path: ${{ env.EXPORT_NAME }}.ipa
          retention-days: 7
