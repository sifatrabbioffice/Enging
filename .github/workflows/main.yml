name: Build Godot iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version (e.g., 4.2.2-stable)'
        required: true
        default: '4.2.2-stable'
      app_name:
        description: 'App name (must match your project name, used in Xcode scheme)'
        required: true
        default: 'MyGame'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot and iOS templates
        run: |
          VERSION="${{ inputs.godot_version }}"
          # 1. Install Godot headless
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_macos.universal.zip"
          unzip -o godot.zip
          sudo mv Godot.app /Applications/
          sudo chmod +x /Applications/Godot.app/Contents/MacOS/Godot

          # 2. Prepare template directory (the path Godot 4 expects)
          TEMPLATES_DIR="${HOME}/Library/Application Support/Godot/export_templates/${VERSION}"
          mkdir -p "${TEMPLATES_DIR}"

          # 3. Download and extract templates correctly
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          unzip -o templates.tpz -d /tmp/tpz
          # The tpz unzips into a "templates/" folder; copy its contents
          cp -R /tmp/tpz/templates/* "${TEMPLATES_DIR}/"
          # Verify
          ls -l "${TEMPLATES_DIR}/ios.zip"

      - name: Prepare project
        run: |
          # Make project fully writable (avoid metadata save errors)
          rm -rf .godot
          chmod -R u+w .

          # If no export_presets.cfg, create a minimal iOS preset
          if [ ! -f export_presets.cfg ]; then
            APP_NAME="${{ inputs.app_name }}"
            cat > export_presets.cfg <<EOF
[preset.0]
name="iOS"
platform="iOS"
runnable=true
export_filter="all_resources"
export_path="build/ios"
script_export_mode=1
[preset.0.options]
architectures="arm64"
application/name="${APP_NAME}"
application/export_method_debug="1"
application/export_method_release="1"
application/targeted_device_family="1"
EOF
          fi

      - name: Export to Xcode project
        run: |
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios

      - name: Build unsigned IPA
        run: |
          APP_NAME="${{ inputs.app_name }}"
          # Locate the generated .xcodeproj
          XCPROJ=$(find build/ios -maxdepth 2 -name "*.xcodeproj" | head -1)
          echo "Using Xcode project: ${XCPROJ}"

          # Archive without signing
          xcodebuild -project "${XCPROJ}" \
            -scheme "${APP_NAME}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/export.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          # Package IPA
          mkdir Payload
          cp -R build/export.xcarchive/Products/Applications/${APP_NAME}.app Payload/
          zip -r build/${APP_NAME}.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa-${{ inputs.app_name }}
          path: build/${{ inputs.app_name }}.ipa
