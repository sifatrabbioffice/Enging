name: Build Godot Editor for iOS (Unsigned IPA)

on:
  workflow_dispatch:   # manual trigger from GitHub Actions tab
  push:
    branches: [ main ]

jobs:
  build-ios-editor:
    runs-on: macos-14   # Apple Silicon runner (M1/M2), required for iOS arm64 builds
    timeout-minutes: 120

    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.2.2-stable        # use a stable release tag
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install scons
          brew install cmake
          # Additional dependencies for iOS compilation
          brew install autoconf automake libtool pkg-config
          # Ensure Xcode command line tools are set up (already present on macOS runner)
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Download and prepare iOS toolchain
        run: |
          # The official Godot iOS build uses the system SDK.
          # We'll point to the iOS SDK included with Xcode.
          export IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "IOS_SDK_PATH=$IOS_SDK_PATH" >> $GITHUB_ENV

      - name: Build Godot editor for iOS (arm64)
        run: |
          scons platform=ios target=editor arch=arm64 \
                ios_sdk_path="$IOS_SDK_PATH" \
                tools=yes module_mono_enabled=no \
                progress=yes -j$(sysctl -n hw.logicalcpu)
          # The resulting binary is a .app bundle inside `bin/`
          # Godot builds a `godot.ios.editor.arm64` binary; we need to wrap it.

      - name: Create .app bundle structure
        run: |
          mkdir -p GodotEditor.app
          # Copy the editor binary into the app
          cp bin/godot.ios.editor.arm64 GodotEditor.app/godot
          # Create a minimal Info.plist
          cat > GodotEditor.app/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>godot</string>
              <key>CFBundleIdentifier</key>
              <string>org.godotengine.editor</string>
              <key>CFBundleName</key>
              <string>Godot Editor</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>4.2.2</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          # Create an empty LaunchScreen storyboard (required)
          mkdir -p GodotEditor.app/Base.lproj
          touch GodotEditor.app/Base.lproj/LaunchScreen.storyboard

      - name: Package as unsigned .ipa
        run: |
          mkdir Payload
          cp -R GodotEditor.app Payload/
          zip -r GodotEditor.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS-Editor-Unsigned
          path: GodotEditor.ipa
