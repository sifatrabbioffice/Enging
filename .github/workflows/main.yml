name: Build Godot 3.6 Engine for iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Godot 3.6 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 3.6-stable
          submodules: recursive

      - name: Setup Python & SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Build iOS static library (GLES3, no Vulkan)
        run: |
          scons platform=ios target=release_debug \
                tools=no arch=arm64 \
                vulkan=no \
                builtin_libpng=yes \
                builtin_zlib=yes \
                use_llvm=yes \
                ios_simulator=no

      - name: Create minimal Xcode project and .ipa
        run: |
          # Create app bundle structure
          mkdir -p Payload/Godot.app
          cp -r bin/libgodot.ios.opt.debug.arm64.a Payload/Godot/
          # Use a simple Info.plist
          cat > Payload/Godot/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Godot</string>
            <key>CFBundleIdentifier</key><string>com.example.godot</string>
            <key>CFBundleName</key><string>Godot</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>MinimumOSVersion</key><string>12.0</string>
            <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF
          # Compile a tiny stub main (actual engine entry point is in the .a)
          cat > Payload/Godot/main.m <<EOF
          #import <UIKit/UIKit.h>
          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"GodotAppDelegate");
              }
          }
          EOF
          # Compile stub and link with the Godot static library
          clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
                -miphoneos-version-min=12.0 -framework UIKit -framework OpenGLES \
                -framework Metal -framework CoreAudio -framework Foundation \
                Payload/Godot/main.m bin/libgodot.ios.opt.debug.arm64.a \
                -o Payload/Godot/Godot
          # Sign (adhoc) and create .ipa
          mkdir -p Payload/Godot/_CodeSignature
          codesign -s - --entitlements - Payload/Godot/Godot <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>get-task-allow</key><false/></dict></plist>
          EOF
          zip -r Godot-iOS.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS.ipa
          path: Godot-iOS.ipa
