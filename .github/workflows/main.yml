name: Build Godot Engine for iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Branch/Tag to build (e.g., 4.2, 4.3-stable, master)'
        required: true
        default: '4.3-stable'
      build_target:
        description: 'Build Target (editor = Run Godot Editor on iOS, template = Game Export Template)'
        required: true
        default: 'editor'
        type: choice
        options:
          - editor
          - template

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Godot Engine Source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.godot_version }} https://github.com/godotengine/godot.git godot-source

      - name: Set up Python and Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons via Homebrew
        run: |
          brew install scons

      - name: Set up Xcode SDK
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -showsdks

      - name: Compile Godot Static Library for iOS
        run: |
          cd godot-source
          if [ "${{ github.event.inputs.build_target }}" = "editor" ]; then
            echo "Building Godot Editor Static Library for iOS..."
            scons platform=ios target=editor arch=arm64 vulkan=yes tests=no
          else
            echo "Building Godot Export Templates..."
            scons platform=ios target=template_release arch=arm64 vulkan=yes tests=no
          fi

      - name: Link Static Library and Compile iOS Executable via Xcode
        run: |
          cd godot-source
          
          # Xcode প্রজেক্ট ডিরেক্টরি যেখানে iOS প্ল্যাটফর্মের ফাইল থাকে
          cd platform/ios/plugins
          
          # মূল সোর্স ফোল্ডারে ফিরে এসে প্রজেক্ট জেনারেট করা বা ফাইল লিংক করা
          cd ../../../
          
          # একটি মিনিমাল Xcode ওয়ার্কস্পেস তৈরি করে ডাইনামিকালি এক্সিকিউটেবল ফাইল কম্পাইল করা
          # Godot এর অফিশিয়াল Xcode টেমপ্লেট ব্যবহার করে ফাইনাল রেন্ডারিং বাইনারি তৈরি করা
          mkdir -p XcodeBuild
          
          # স্ট্যাটিক লাইব্রেরিকে মূল অ্যাপ স্ট্রাকচারে রূপান্তরের কমান্ড
          xcrun -sdk iphoneos clang -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=13.0 \
            -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore \
            -framework OpenGLES -framework AudioToolbox -framework AVFoundation -framework CoreAudio \
            -framework CoreMedia -framework GameController -framework CoreMotion -framework Metal \
            -framework MetalKit -framework MobileCoreServices -framework Security -framework SystemConfiguration \
            -ObjC -all_load bin/libgodot.ios.editor.arm64.a -o XcodeBuild/Godot
            
      - name: Package Unsigned .app Bundle into .ipa
        run: |
          cd godot-source
          mkdir -p Payload/Godot.app
          
          # আইফোনের এক্সিকিউটেবল ফাইলের জন্য প্রয়োজনীয় বেসিক Info.plist তৈরি
          cat <<EOF > Payload/Godot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>English</string>
              <key>CFBundleExecutable</key>
              <string>Godot</string>
              <key>CFBundleIdentifier</key>
              <string>org.godotengine.godot</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Godot</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # জেনারেট হওয়া ফাইল কপি করা
          cp XcodeBuild/Godot Payload/Godot.app/Godot
          chmod +x Payload/Godot.app/Godot
          
          # জিপ ফাইল বা IPA তৈরি
          zip -r ../godot-ios-unsigned.ipa Payload

      - name: Upload Unsigned IPA Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-${{ github.event.inputs.build_target }}-${{ github.event.inputs.godot_version }}
          path: godot-ios-unsigned.ipa
          retention-days: 7
