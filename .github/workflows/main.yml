name: Build Godot iOS (Unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version (e.g., 4.2.2-stable)'
        required: true
        default: '4.2.2-stable'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          VERSION="${{ github.event.inputs.godot_version }}"
          GODOT_BIN="Godot.app/Contents/MacOS/Godot"
          # Download headless macOS editor
          curl -L -o Godot.zip "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_macos.universal.zip"
          unzip Godot.zip
          mv Godot.app /Applications/Godot.app
          chmod +x /Applications/$GODOT_BIN
          # Download iOS export templates
          mkdir -p ~/Library/Application\ Support/Godot/templates/${VERSION}
          curl -L -o templates.zip "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          unzip templates.zip -d ~/Library/Application\ Support/Godot/templates/${VERSION}
          mv ~/Library/Application\ Support/Godot/templates/${VERSION}/templates/* ~/Library/Application\ Support/Godot/templates/${VERSION}/
          rm -rf ~/Library/Application\ Support/Godot/templates/${VERSION}/templates

      - name: Export iOS Xcode project
        run: |
          # Ensure export_presets.cfg exists and has iOS configured (or create one)
          # This minimal config assumes a project.godot in the root
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/export.xcodeproj || true
          # If you don't have an export preset named "iOS", adjust the name.
          # Alternatively, generate a basic preset on the fly:
          cat > export_presets.cfg <<EOF
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/export"
          script_export_mode=1
          script_encryption_key=""
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          architectures="arm64"
          application/app_store_team_id=""
          application/provisioning_profile_uuid_debug=""
          application/code_sign_identity_debug=""
          application/export_method_debug="1"
          application/provisioning_profile_uuid_release=""
          application/code_sign_identity_release=""
          application/export_method_release="1"
          application/targeted_device_family="1"
          application/name="MyGame"
          application/info_plist_properties=""
          application/icon_interpolation="4"
          text_embed/embed_pck=false
          capabilities/access_wifi=false
          capabilities/push_notifications=false
          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          privacy/camera_usage_description=""
          privacy/microphone_usage_description=""
          privacy/photolibrary_usage_description=""
          privacy/file_timestamp_usage_description=""
          privacy/location_usage_description=""
          privacy/address_book_usage_description=""
          privacy/calendar_usage_description=""
          privacy/motion_usage_description=""
          privacy/bluetooth_usage_description=""
          privacy/bluetooth_always_usage_description=""
          privacy/faceid_usage_description=""
          privacy/speech_recognition_usage_description=""
          privacy/health_share_usage_description=""
          privacy/health_update_usage_description=""
          privacy/homekit_usage_description=""
          privacy/media_library_usage_description=""
          privacy/nfc_usage_description=""
          privacy/siri_usage_description=""
          privacy/tracking_usage_description=""
          EOF
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/export.xcodeproj

      - name: Build unsigned IPA
        run: |
          cd build/ios
          # The exported folder is actually an .xcodeproj inside a directory; adjust if needed
          # Godot exports a folder containing a .xcodeproj. We assume it's at build/ios/export.xcodeproj
          xcodebuild -project export.xcodeproj \
            -scheme MyGame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./export.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          # Create unsigned IPA from archive
          mkdir Payload
          cp -R ./export.xcarchive/Products/Applications/MyGame.app Payload/
          zip -r ../MyGame.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/MyGame.ipa
