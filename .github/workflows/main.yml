name: Build Godot iOS Editor (Unsigned IPA)

on:
  workflow_dispatch: # এটি আপনাকে গিটহাব থেকে ম্যানুয়ালি রান করার সুযোগ দেবে

jobs:
  build-ios:
    runs-on: macos-14 # আইফোন ১৫ প্রো ম্যাক্স বা আধুনিক iOS আর্কিটেকচারের জন্য Xcode ১৫ এবং macOS ১৪ প্রয়োজন
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot' # অফিশিয়াল গোডট সোর্স কোড
          ref: 'master' # অথবা আপনি চাইলে নির্দিষ্ট স্টেবল ভার্সন দিতে পারেন (যেমন: '4.2')

      - name: Setup Python and SCons
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.x'

      - name: Install SCons and Dependencies
        run: |
          python -m pip install scons
          brew install molten-vk # Vulkan rendering এর জন্য প্রয়োজন

      - name: Cache SCons Artifacts
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: ${{ runner.os }}-godot-ios-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-godot-ios-

      - name: Compile Godot for iOS (Simulator & Device Libraries)
        run: |
          export SCONS_CACHE=.scons_cache
          # আইফোনের আর্কিটেকচার (arm64) এর জন্য ইঞ্জিন কমপাইল করা
          scons platform=ios target=editor arch=arm64 vsproj=no -j$(sysctl -n hw.logicalcpu)

      - name: Generate Xcode Project & Build App Bundle
        run: |
          # গোডটের নিজস্ব বিল্ড স্ক্রিপ্ট ব্যবহার করে Xcode প্রজেক্ট স্ট্রাকচার তৈরি
          cd platform/ios
          # এখানে আমরা আনসাইনড বিল্ড নিশ্চিত করতে CODE_SIGNING_ALLOWED=NO ব্যবহার করব
          xcodebuild -project godot_ios.xcodeproj \
            -scheme "godot_ios" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_ONLY=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CLEAN_BUILD_NO=YES \
            build

      - name: Package Package as Unsigned IPA
        run: |
          # Xcode বিল্ড ডিরেক্টরি থেকে .app ফাইলটি খুঁজেPayload ফোল্ডারে নেওয়া
          mkdir -p Payload
          BUILD_DIR=$(xcodebuild -project platform/ios/godot_ios.xcodeproj -showBuildSettings | grep -m 1 "TARGET_BUILD_DIR" | awk '{print $3}')
          
          if [ -d "$BUILD_DIR/godot_ios.app" ]; then
            cp -r "$BUILD_DIR/godot_ios.app" Payload/
          else
            # যদি ডিফল্ট পাথ না পাওয়া যায় তবে স্ট্যান্ডার্ড পাথে খোঁজা
            cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/ 2>/dev/null || true
          fi
          
          # জিপ করে .ipa ফাইলে রূপান্তর করা
          zip -r Godot_iOS_Editor_Unsigned.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS-Editor-Unsigned-IPA
          path: Godot_iOS_Editor_Unsigned.ipa
          retention-days: 7
