name: Build Godot iOS Editor (Unsigned IPA)

on:
  workflow_dispatch:   # manual trigger from Actions tab
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon required for arm64 iOS builds
    timeout-minutes: 180

    steps:
      - name: Checkout godot-ios-editor (includes Godot submodule)
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot-ios-editor
          ref: main                # or a specific tag like v4.2.2
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install scons cmake python@3.11
          # Ensure Xcode command line tools are in place
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Godot engine library for iOS
        run: |
          # The build.sh script downloads/updates the Godot submodule and builds
          # the engine as a static library for iOS. It expects to be run from the repo root.
          chmod +x build.sh
          ./build.sh

      - name: Build Xcode project (unsigned archive)
        run: |
          # Clean and build the Xcode project without code signing
          xcodebuild clean archive \
            -project godot-ios-editor.xcodeproj \
            -scheme godot-ios-editor \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/godot-ios-editor.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned .ipa
        run: |
          # Extract the .app from the archive
          mkdir Payload
          cp -R ./build/godot-ios-editor.xcarchive/Products/Applications/godot-ios-editor.app Payload/
          zip -r GodotEditor.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Godot-iOS-Editor-Unsigned
          path: GodotEditor.ipa
